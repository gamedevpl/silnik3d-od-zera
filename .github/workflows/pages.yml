# Publishes docs/ to GitHub Pages and adds what is generated, so nothing built sits in the repo:
# the browser builds of every epNN tag (web/build.sh) and the demo's C++ for its chat helper.
name: Pages
on:
  push:
    branches: [main]
    tags: ['ep[0-9][0-9]']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # web/build.sh reads the episode tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache
      - name: Assemble the site
        run: |
          cp -r docs _site
          web/build.sh _site/play
          node web/ask-source.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Actions are pinned to commit SHAs and nothing outside actions/* is used (org policy).
# Publishes docs/ to GitHub Pages and adds what is generated, so nothing built sits in the repo:
# the browser builds of every epNN tag (web/build.sh) and the demo's C++ for its chat helper.
name: Pages
on:
  push:
    branches: [main]
    tags: ['ep[0-9][0-9]']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # web/build.sh reads the episode tags
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Emscripten 7.0.0
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.0
      - name: Assemble the site
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cp -r docs _site
          web/build.sh _site/play
          node web/ask-source.mjs _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
